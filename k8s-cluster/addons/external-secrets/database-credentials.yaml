# The database's credentials, delivered into the namespace the database lives in.
#
# The keys are renamed on the way through, so that the derived secret can be
# consumed directly as environment variables with the names the application
# already reads. The external secret remains the source of truth and the cluster
# secret is derived from it, so deleting the derived secret is repaired
# automatically and a value changed at the source appears without anyone running
# a command.
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-db-credentials
  namespace: database
spec:
  # Short, because this is a local cluster where the point is to watch the value
  # follow the source within a coffee break rather than within an hour.
  refreshInterval: 1m
  secretStoreRef:
    name: vault-local
    kind: ClusterSecretStore
  target:
    name: agents-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: agents-infra/local/database
        property: username
    - secretKey: password
      remoteRef:
        key: agents-infra/local/database
        property: password
    - secretKey: database
      remoteRef:
        key: agents-infra/local/database
        property: database
