# How the cluster reads its credentials from the local secret store.
#
# The store is reachable at the container runtime's host alias, which resolves
# to the Windows host from inside a pod, so no bridging, endpoint object or
# network attachment is needed. Verification is plaintext because the local
# store runs with TLS disabled; a managed deployment would use HTTPS and a
# secret manager that does not need a long-lived token at all.
#
# The token is the scoped one written by the seed script, not the store's
# administrative token. Its namespace must be given explicitly: a cluster-scoped
# store has no namespace of its own to look in, and omitting this is the most
# common way to get an unusable store that reports no useful error.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-local
spec:
  provider:
    vault:
      server: http://host.docker.internal:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
