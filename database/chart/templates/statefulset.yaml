{{- $secretName := include "agents-database.secretName" . -}}
{{- $keys := .Values.auth.secretKeys -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agents-database.fullname" . }}
  labels:
    {{- include "agents-database.labels" . | nindent 4 }}
spec:
  # One writer. There is no operator and no automatic failover: an additional
  # replica would not be promoted on its own, which is why the data safety net
  # is the scheduled dump rather than replication.
  replicas: 1
  serviceName: {{ include "agents-database.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "agents-database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agents-database.labels" . | nindent 8 }}
    spec:
      # Long enough for a clean shutdown of open connections rather than a
      # crash recovery on the next start.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # The server writes only to its data directory and to two temporary
            # directories, both mounted below.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - -c
            - max_connections={{ .Values.postgresql.maxConnections }}
            {{- range .Values.postgresql.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index $keys "database" }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index $keys "username" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index $keys "password" }}
            # A directory of its own inside the volume, so that a stray file at
            # the mount root cannot stop the server from starting.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: {{ .Values.postgresql.initdbArgs | quote }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          # Preferred, not required: a single-replica database must still be
          # able to schedule, while any additional replica is pushed onto a
          # different node.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "agents-database.selectorLabels" . | nindent 20 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "agents-database.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "agents-database.storageSize" . }}
