apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-database.fullname" . }}
  labels:
    {{- include "agents-database.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "agents-database.selectorLabels" . | nindent 4 }}
---
# Gives the pod a stable name of its own inside the cluster, which is what a
# stateful workload expects and what makes a future replica addressable.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-database.fullname" . }}-headless
  labels:
    {{- include "agents-database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "agents-database.selectorLabels" . | nindent 4 }}
