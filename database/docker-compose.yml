name: agents-database

services:
  postgres:
    build: .
    image: agents-database:local
    container_name: agents-db
    restart: unless-stopped
    # wrapper entrypoint: start server, then restore the latest backup
    entrypoint: ["/usr/local/bin/docker-entrypoint-wrapper.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allagents}
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      # Local dev only — override via POSTGRES_PASSWORD in a .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      # true (default): restore the latest backup on every container start
      RESTORE_ON_START: ${RESTORE_ON_START:-true}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:17 stores data here; the volume survives `down` (use `down -v` to wipe)
      - pgdata:/var/lib/postgresql/data
      # hourly dumps land in ./bck on the host, shared with the backup sidecar
      - ./bck:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agents} -d $${POSTGRES_DB:-allagents}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    build: .
    image: agents-database:local
    container_name: agents-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allagents}
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      # seconds between dumps (3600 = every hour)
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
      # TTL retention: delete dumps older than this many hours...
      BACKUP_TTL_HOURS: ${BACKUP_TTL_HOURS:-48}
      # ...but never prune below this many dumps, however old they are
      BACKUP_MIN_KEEP: ${BACKUP_MIN_KEEP:-3}
    volumes:
      - ./bck:/backups

volumes:
  pgdata:
